# Scaffolded by webo — build on GitHub Actions, image on GHCR, deploy via webo-deploy.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    # webo-deploy commits its own scaffold back to main while it deploys, and
    # that push retriggers this workflow — so one merge restarted the container
    # two or three times, and a reader arriving in the wrong window saw the site
    # down. The chain stops here instead of relying on the scaffold happening to
    # be byte-identical.
    if: "!startsWith(github.event.head_commit.message, 'chore: webo scaffold')"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check out app"
        uses: actions/checkout@v4

      - name: "🧰 Check out webo-deploy"
        uses: actions/checkout@v4
        with:
          repository: axolutions/webo-deploy
          token: ${{ secrets.WEBO_DEPLOY_TOKEN }}
          path: .webo-deploy

      - name: "🛸 webo-deploy"
        uses: ./.webo-deploy
        with:
          app: blogo
          dockerfile: Dockerfile
          compose_files: deploy/docker-compose.yml deploy/docker-compose.homelab.yml
          service: blogo
          github-token: ${{ secrets.GITHUB_TOKEN }}
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
