name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blogo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.0"
          otp-version: "27"

      - name: "📦 Cache deps"
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - run: mix deps.get
      - run: mix format --check-formatted
      # Warnings become errors here rather than in review, where they are
      # noise that someone has to decide to care about.
      - run: mix compile --warnings-as-errors
      # The strings in the code and the strings in the .pot have to be the same
      # set. A string added to a template without extracting it is a string
      # nobody can translate, and it reaches the reader in the other language.
      - run: mix gettext.extract --check-up-to-date
      - run: mix test
        env:
          MIX_ENV: test
          DATABASE_URL: ecto://postgres:postgres@localhost/blogo_test
