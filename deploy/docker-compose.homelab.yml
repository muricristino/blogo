# Homelab override — GHCR image, shared network with the tunnel.
services:
  blogo:
    image: ghcr.io/muricristino/blogo:latest
    container_name: blogo
    labels:
      webo.tech: docker
    env_file:
      - path: .env
        required: false
    networks:
      - homelab

networks:
  homelab:
    external: true
