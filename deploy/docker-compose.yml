# blogo — scaffolded by webo around the repository's own Dockerfile.
# Run: docker compose -f deploy/docker-compose.yml up -d --build
name: blogo
services:
  blogo:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    # The tunnel reaches every app at port 3000 on the shared network, so the
    # container has to listen there. Most images honour PORT; if yours does
    # not, EXPOSE 3000 and serve on it.
    environment:
      - PORT=3000
